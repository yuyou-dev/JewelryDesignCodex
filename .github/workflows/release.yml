name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release
        run: npm test
      - name: Scan public release content
        run: npm run scan:public

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build source archive and checksum
        shell: bash
        run: |
          archive="JewelryDesignCodex-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix="JewelryDesignCodex-${GITHUB_REF_NAME}/" -o "$archive" "$GITHUB_REF_NAME"
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            JewelryDesignCodex-${{ github.ref_name }}.zip
            JewelryDesignCodex-${{ github.ref_name }}.zip.sha256
