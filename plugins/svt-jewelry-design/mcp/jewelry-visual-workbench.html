<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>珠宝视觉工作台</title>
  <style>
    :root{color-scheme:light dark;--bg:#fff;--panel:#f7f7f7;--ink:#171717;--muted:#737373;--line:#dedede;--gold:#b78327;--mark:#d19a38}*{box-sizing:border-box}html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:transparent;color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}.app{height:clamp(500px,66vw,620px);min-height:0;display:grid;grid-template-rows:48px 1fr;background:var(--bg)}header{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line)}.brand{width:28px;height:28px;object-fit:contain}.title{font-size:16px;font-weight:700}.mode-badge{color:var(--muted);font-size:12px}.header-actions{margin-left:auto;display:flex;gap:7px}.quiet,.primary{min-height:36px;border-radius:9px;padding:0 13px;border:1px solid var(--line);background:transparent}.primary{border-color:#171717;background:#171717;color:#fff;font-weight:650}.primary:disabled{opacity:.45}.layout{min-height:0;display:grid;grid-template-columns:72px minmax(300px,1fr) 250px}.layout>aside{padding:9px 7px;border-right:1px solid var(--line);min-height:0}.rail-label,.group-title{margin:0 0 7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em}.asset-list{display:grid;gap:7px}.asset{position:relative;width:58px;height:58px;padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}.asset img{width:100%;height:100%;object-fit:cover}.asset span{position:absolute;left:3px;right:3px;bottom:3px;padding:1px 3px;border-radius:4px;background:rgba(0,0,0,.64);color:#fff;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset.checker{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}.workspace{position:relative;min-width:0;min-height:0;background:var(--panel)}.stage-shell,.stage{position:absolute;inset:0}.stage{overflow:hidden;touch-action:pan-y}.stage canvas{width:100%;height:100%;display:block}.annotation-layer{position:absolute;inset:0;pointer-events:none}.annotation-marker{position:absolute;pointer-events:auto;cursor:pointer;border:2px solid var(--mark);color:#171717;background:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;transform:translate(-50%,-50%)}.annotation-marker.anchor{width:25px;height:25px;border-radius:50%}.annotation-marker.region{border-radius:6px;background:rgba(209,154,56,.08);transform:none}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);background:var(--bg);z-index:7}.empty img{width:66px;height:66px;object-fit:contain}.hidden{display:none!important}.tool-dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 94%,transparent);box-shadow:0 8px 22px rgba(0,0,0,.1);z-index:5}.tool{min-width:47px;min-height:38px;padding:5px 7px;border:0;border-radius:8px;background:transparent;font-size:11px}.tool.active{background:#171717;color:#fff}.tool:disabled{opacity:.35}.status{position:absolute;left:50%;top:12px;z-index:8;transform:translateX(-50%);max-width:80%;padding:7px 12px;border-radius:9px;background:#171717;color:#fff;text-align:center}.drawer{min-height:0;padding:10px;border-left:1px solid var(--line);display:grid;align-content:start;gap:10px;background:var(--bg)}.group{padding-bottom:9px;border-bottom:1px solid var(--line)}.group:last-child{border:0}.field{display:grid;gap:4px;margin:0 0 7px}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 8px;outline:none}textarea{height:56px;resize:none}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.inline{display:grid;grid-template-columns:1fr 1fr;gap:7px}.range-row{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:6px;margin:6px 0;font-size:11px}.range-row input{padding:0}.hint{margin:6px 0 0;color:var(--muted);font-size:10px}.annotation-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}.annotation-tab{min-width:44px;min-height:30px;border:1px solid var(--line);border-radius:7px;background:transparent;font-size:11px}.annotation-tab.active{background:#171717;color:#fff}.annotation-editor{display:grid;grid-template-columns:1fr auto;gap:6px}.annotation-editor textarea{height:54px}.danger{border:0;background:transparent;color:#a33;padding:0 4px}.cutout-panel{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.cutout-panel .primary{width:100%;margin-top:7px}.confirmed{color:#287344;font-weight:650}.switch{display:flex;justify-content:space-between;align-items:center;font-size:11px}.switch input{width:auto}.fullscreen .stage{touch-action:none}
    .drawer.annotation-mode .global-intent,.drawer.annotation-mode .global-change{display:none}.drawer.annotation-mode .preservation-row{grid-template-columns:1fr}.drawer.annotation-mode .transform-group .hint{display:none}
    @media(max-width:760px){.layout{grid-template-columns:66px 1fr}.drawer{position:absolute;z-index:9;right:0;top:48px;bottom:0;width:min(300px,82vw);padding:7px;gap:5px;overflow:hidden;box-shadow:-10px 0 28px rgba(0,0,0,.14)}.drawer .group{padding-bottom:5px}.drawer .group-title{margin-bottom:4px}.drawer .field{gap:2px;margin-bottom:4px}.drawer input,.drawer select,.drawer textarea{padding:5px 7px}.drawer textarea{height:44px}.drawer .range-row{margin:3px 0}.drawer .hint{margin-top:3px;font-size:9px}.drawer .cutout-panel{padding:6px}.drawer.annotation-mode .transform-group{display:none}.drawer.annotation-mode .annotation-tabs{flex-wrap:nowrap;overflow-x:auto;margin-bottom:4px}.drawer.annotation-mode #annotationGroup .hint{display:none}.drawer.closed{display:none}.app{height:clamp(500px,78vw,570px)}.header-actions .quiet:first-child{display:none}.tool{min-width:43px}}
    @media(max-width:420px){.layout{grid-template-columns:58px 1fr}.asset{width:46px;height:46px}.tool{min-width:38px;padding:4px;font-size:10px}.brand{display:none}.title{font-size:14px}.mode-badge{display:none}.quiet,.primary{padding:0 9px}}
    @media(prefers-color-scheme:dark){:root{--bg:#151515;--panel:#222;--ink:#f4f4f4;--muted:#aaa;--line:#3b3b3b}.primary,.tool.active,.annotation-tab.active{background:#f3f3f3;color:#171717}.annotation-marker{color:#171717}.asset.checker{background-color:#eee}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header><img class="brand" src="{{BRAND_HEADER_DATA_URI}}" alt="{{BRAND_NAME}}"><div class="title" id="title">珠宝视觉工作台</div><div class="mode-badge" id="modeBadge">准备中</div><div class="header-actions"><button class="quiet" id="fullscreenButton" type="button">展开编辑</button><button class="quiet" id="drawerButton" type="button">设计设置</button><button class="primary" id="saveButton" type="button" disabled>保存并继续</button></div></header>
  <section class="layout">
    <aside><p class="rail-label">素材</p><div class="asset-list" id="assetList"></div></aside>
    <div class="workspace"><div class="stage-shell"><div class="stage" id="stage"><canvas id="sceneCanvas"></canvas><div class="annotation-layer" id="annotationLayer"></div><div class="empty" id="empty"><div><img src="{{BRAND_LOADING_DATA_URI}}" alt=""><div>{{BRAND_NAME}} · 正在加载视觉素材…</div></div></div></div><div class="tool-dock" id="toolDock"><button class="tool active" data-tool="select" type="button">选择</button><button class="tool local-tool" data-tool="paint" type="button">画笔</button><button class="tool local-tool" data-tool="erase" type="button">橡皮</button><button class="tool local-tool" data-tool="anchor" type="button">锚点</button><button class="tool cutout-tool" data-tool="cutout" type="button">自动抠图</button><button class="tool cutout-tool" data-tool="restore" type="button">保留</button><button class="tool cutout-tool" data-tool="remove" type="button">移除</button></div><div class="status hidden" id="status"></div></div></div>
    <section class="drawer" id="drawer">
      <div class="group"><p class="group-title">设计意图</p><div class="inline"><div class="field"><label for="category">作品类型</label><select id="category"><option value="ring">戒指</option><option value="bracelet">手链 / 手镯</option><option value="necklace">项链</option><option value="pendant">吊坠</option><option value="earrings">耳饰</option><option value="brooch">胸针</option><option value="other">其他品类</option></select></div><div class="field hidden" id="customCategoryField"><label for="customCategory">自定义品类</label><input id="customCategory" maxlength="40" placeholder="例如脚链、发饰"></div></div><div class="field global-intent"><label for="instruction">核心要求</label><textarea id="instruction" maxlength="500" placeholder="描述主题、构造或整体设计意图；作品品类以上方选择为准"></textarea></div><div class="inline local-only preservation-row"><div class="field"><label for="preserve">必须保留</label><input id="preserve" maxlength="240" placeholder="主石切割、原有比例"></div><div class="field global-change"><label for="change">允许变化</label><input id="change" maxlength="240" placeholder="可重做的结构或区域"></div></div></div>
      <div class="group hidden" id="annotationGroup"><p class="group-title">标注修改意见</p><div class="annotation-tabs" id="annotationTabs"></div><div class="annotation-editor"><textarea id="annotationInstruction" maxlength="240" placeholder="说明当前锚点或涂抹区域要如何修改"></textarea><button class="danger" id="deleteAnnotation" type="button">删除</button></div><p class="hint">每个锚点或涂抹区域对应一条独立说明；未填写时不能保存。</p></div>
      <div class="group cutout-panel hidden" id="cutoutPanel"><p class="group-title">抠图确认</p><div id="cutoutState">请检查左侧“透明抠图”和“白底预览”，必要时用保留/移除笔修正。</div><button class="primary" id="confirmCutout" type="button">确认抠图，开始绘制</button></div>
      <div class="group transform-group"><p class="group-title">位置与工具</p><div class="range-row"><span>缩放</span><input id="scale" type="range" min="0.04" max="1.2" step="0.01"><span id="scaleValue"></span></div><div class="range-row"><span>旋转</span><input id="rotation" type="range" min="-180" max="180" step="1"><span id="rotationValue"></span></div><div class="range-row"><span>笔刷</span><input id="brush" type="range" min="4" max="64" step="1" value="18"><span id="brushValue">18</span></div><label class="switch tryon-only"><span>成对佩戴（耳饰）</span><input id="pair" type="checkbox"></label><p class="hint">画布记录近似位置与设计意图；Image-2 负责重建可佩戴结构、材质、光影与遮挡。</p></div>
      <div class="group local-only"><p class="group-title">生成设置</p><div class="inline"><div class="field"><label for="material">材质工艺</label><input id="material" maxlength="180" placeholder="18K白金、微镶钻石"></div><div class="field"><label for="style">目标风格</label><input id="style" maxlength="180" placeholder="当代高级珠宝"></div></div></div>
    </section>
  </section>
</main>
<script>
const PROTOCOL="2026-01-26";let rpcId=1;const pending=new Map();let active=null,media={},tool="select",baseImage=null,overlayImage=null,cutoutCanvas=null,drag=null,strokes=[],annotations=[],activeAnnotation="",counters={anchor:0,region:0},cutoutConfirmed=false;
const $=id=>document.getElementById(id),scene=$("sceneCanvas"),stage=$("stage"),ctx=scene.getContext("2d"),status=$("status");
function send(message){window.parent.postMessage(message,"*")}function rpc(method,params={}){const id=rpcId++;send({jsonrpc:"2.0",id,method,params});return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});setTimeout(()=>{if(pending.delete(id))reject(new Error(`${method} 超时`))},12000)})}
async function connect(){try{await rpc("ui/initialize",{appInfo:{name:"svt-jewelry-visual-workbench",version:"2.0.0"},appCapabilities:{availableDisplayModes:["inline","fullscreen"]},protocolVersion:PROTOCOL});send({jsonrpc:"2.0",method:"ui/notifications/initialized"})}catch(error){console.warn(error)}}
function walk(value,depth=0){if(depth>6||value==null)return null;if(typeof value==="string"){try{return walk(JSON.parse(value),depth+1)}catch{return null}}if(Array.isArray(value)){for(const item of value){const found=walk(item,depth+1);if(found)return found}return null}if(typeof value==="object"){if(value.visualWorkbench)return value;for(const key of ["structuredContent","result","output","content"]){const found=walk(value[key],depth+1);if(found)return found}}return null}
function nestedMedia(value,depth=0){if(depth>6||value==null)return null;if(typeof value==="string"){try{return nestedMedia(JSON.parse(value),depth+1)}catch{return null}}if(Array.isArray(value)){for(const item of value){const found=nestedMedia(item,depth+1);if(found)return found}return null}if(typeof value==="object"){if(value._meta?.visualWorkbenchMedia)return value._meta.visualWorkbenchMedia;if(value.visualWorkbenchMedia)return value.visualWorkbenchMedia;for(const key of ["result","output","content"]){const found=nestedMedia(value[key],depth+1);if(found)return found}}return null}
function toolError(value,depth=0){if(depth>6||value==null)return "";if(typeof value==="string"){try{return toolError(JSON.parse(value),depth+1)}catch{return ""}}if(Array.isArray(value)){for(const item of value){const found=toolError(item,depth+1);if(found)return found}return ""}if(typeof value!=="object")return "";if(value.isError===true){const blocks=Array.isArray(value.content)?value.content:[],text=blocks.find(item=>item?.type==="text"&&typeof item.text==="string")?.text;return text||"视觉工具返回错误"}for(const key of ["result","output","content","text"]){const found=toolError(value[key],depth+1);if(found)return found}return ""}
function missingVisualMedia(next,nextMedia){if(next.workflow==="tryon")return !nextMedia.model||!nextMedia.jewelry;if(next.source&&!nextMedia.source)return true;if(next.stone&&!nextMedia.stone)return true;const references=Array.isArray(next.referenceImages)?next.referenceImages:[];if(references.some((_,index)=>!nextMedia.references?.[`REF-${index+1}`]))return true;return false}
function normalizedWorkbench(value){return !!value?.sessionId&&['local_edit','tryon'].includes(value.workflow)}
function payload(value,meta={},waitForMedia=false){const found=walk(value);if(!found?.visualWorkbench)return false;const next=found.visualWorkbench;if(waitForMedia&&!normalizedWorkbench(next))return false;const nextMedia=meta?.visualWorkbenchMedia||nestedMedia(value)||window.openai?.toolResponseMetadata?.visualWorkbenchMedia||{};if(missingVisualMedia(next,nextMedia)){if(waitForMedia)return false;active=null;terminalLoading("视觉素材数据不完整，请重新调用工具");return true}active=next;media=nextMedia;document.querySelector('option[value="other"]').hidden=active.workflow==="tryon";renderApp();return true}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id&&pending.has(message.id)){const waiter=pending.get(message.id);pending.delete(message.id);message.error?waiter.reject(new Error(message.error.message)):waiter.resolve(message.result);return}if(message.method==="ui/notifications/tool-input")payload({structuredContent:{visualWorkbench:message.params?.arguments}},{},true);if(message.method==="ui/notifications/tool-result"){const raw=message.params,error=toolError(raw);if(error){active=null;terminalLoading(error);return}let rendered=payload(raw,raw?._meta||{});if(!rendered){const block=Array.isArray(raw?.content)?raw.content.find(item=>item?.type==="text"&&typeof item.text==="string"):null;if(block){try{const wrapped=JSON.parse(block.text),wrappedError=toolError(wrapped);if(wrappedError){active=null;terminalLoading(wrappedError);return}rendered=payload(wrapped,wrapped?._meta||{})}catch{}}}}});
function showStatus(text,timeout=2400){status.textContent=text;status.classList.remove("hidden");if(timeout)setTimeout(()=>status.classList.add("hidden"),timeout)}function terminalLoading(text){const box=$("empty"),message=document.createElement("div"),title=document.createElement("strong"),detail=document.createElement("p");title.textContent="视觉工作台未能打开";detail.textContent=text;detail.style.margin="8px 0 0";message.append(title,detail);box.replaceChildren(message);box.classList.remove("hidden");$("saveButton").disabled=true}function loadImage(src){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error("图片无法读取"));image.src=src})}function fitRect(image,w,h){const ratio=Math.min(w/image.naturalWidth,h/image.naturalHeight),rw=image.naturalWidth*ratio,rh=image.naturalHeight*ratio;return{x:(w-rw)/2,y:(h-rh)/2,w:rw,h:rh}}
function colorDistance(p,index,color){return Math.hypot(p[index]-color[0],p[index+1]-color[1],p[index+2]-color[2])}function autoCutout(image){const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true}),ratio=Math.min(1,1000/Math.max(image.naturalWidth,image.naturalHeight));c.width=Math.max(1,Math.round(image.naturalWidth*ratio));c.height=Math.max(1,Math.round(image.naturalHeight*ratio));x.drawImage(image,0,0,c.width,c.height);const data=x.getImageData(0,0,c.width,c.height),p=data.data,w=c.width,h=c.height,samples=[],step=Math.max(1,Math.floor((w+h)/48));for(let px=0;px<w;px+=step){for(const py of [0,h-1]){const i=(py*w+px)*4;samples.push([p[i],p[i+1],p[i+2]])}}for(let py=0;py<h;py+=step){for(const px of [0,w-1]){const i=(py*w+px)*4;samples.push([p[i],p[i+1],p[i+2]])}}const bins=new Map;for(const color of samples){const key=color.map(v=>Math.round(v/32)).join("-");const bin=bins.get(key)||{count:0,sum:[0,0,0]};bin.count++;for(let i=0;i<3;i++)bin.sum[i]+=color[i];bins.set(key,bin)}const minimumCluster=Math.max(3,Math.ceil(samples.length*.18)),backgroundColors=[...bins.values()].filter(bin=>bin.count>=minimumCluster).sort((a,b)=>b.count-a.count).slice(0,3).map(bin=>bin.sum.map(v=>v/bin.count));if(!backgroundColors.length){const bin=[...bins.values()].sort((a,b)=>b.count-a.count)[0];backgroundColors.push(bin.sum.map(v=>v/bin.count))}const background=index=>backgroundColors.some(color=>colorDistance(p,index,color)<42),seen=new Uint8Array(w*h),queue=new Int32Array(w*h);let head=0,tail=0;function neighbors(q){const px=q%w,py=Math.floor(q/w),items=[];if(px>0)items.push(q-1);if(px<w-1)items.push(q+1);if(py>0)items.push(q-w);if(py<h-1)items.push(q+w);return items}function seed(px,py){const q=py*w+px,i=q*4;if(!seen[q]&&background(i)){seen[q]=1;queue[tail++]=q}}for(let px=0;px<w;px++){seed(px,0);seed(px,h-1)}for(let py=0;py<h;py++){seed(0,py);seed(w-1,py)}while(head<tail){const q=queue[head++];for(const n of neighbors(q)){if(!seen[n]&&background(n*4)){seen[n]=1;queue[tail++]=n}}}for(let q=0;q<w*h;q++){if(seen[q])p[q*4+3]=0;else if(neighbors(q).some(n=>seen[n]))p[q*4+3]=190}x.putImageData(data,0,0);return c}
function whitePreviewDataUrl(){if(!cutoutCanvas)return"";const c=document.createElement("canvas"),x=c.getContext("2d");c.width=cutoutCanvas.width;c.height=cutoutCanvas.height;x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(cutoutCanvas,0,0);return c.toDataURL("image/png")}
function addAsset(src,label,checker=false){const button=document.createElement("button");button.className=`asset${checker?" checker":""}`;button.type="button";const img=document.createElement("img");img.src=src;img.alt=label;const span=document.createElement("span");span.textContent=label;button.append(img,span);$("assetList").append(button)}function renderAssets(){$("assetList").replaceChildren();const baseSrc=active.workflow==="tryon"?media.model:media.source,overlaySrc=active.workflow==="tryon"?media.jewelry:media.stone;if(baseSrc)addAsset(baseSrc,active.workflow==="tryon"?"模特":"源图");if(overlaySrc){addAsset(overlaySrc,active.workflow==="tryon"?"珠宝原图":"主石原图");if(cutoutCanvas){addAsset(cutoutCanvas.toDataURL("image/png"),"透明抠图",true);addAsset(whitePreviewDataUrl(),"白底预览")}}Object.entries(media.references||{}).forEach(([id,src])=>addAsset(src,id))}
function resize(){const rect=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);scene.width=Math.max(1,Math.round(rect.width*dpr));scene.height=Math.max(1,Math.round(rect.height*dpr));scene.style.width=`${rect.width}px`;scene.style.height=`${rect.height}px`;draw()}function draw(){const w=scene.width,h=scene.height;ctx.clearRect(0,0,w,h);ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);if(baseImage){const b=fitRect(baseImage,w,h);ctx.drawImage(baseImage,b.x,b.y,b.w,b.h)}if(overlayImage&&cutoutCanvas){const t=active.transform;ctx.save();ctx.translate(t.x*w,t.y*h);ctx.rotate(t.rotation*Math.PI/180);const ow=w*t.scale,oh=ow*(cutoutCanvas.height/cutoutCanvas.width);ctx.drawImage(cutoutCanvas,-ow/2,-oh/2,ow,oh);if(active.workflow==="tryon"&&active.category==="earrings"&&active.pair){ctx.scale(-1,1);ctx.drawImage(cutoutCanvas,ow*.65,-oh/2,ow,oh)}ctx.restore()}for(const stroke of strokes){ctx.beginPath();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.width*w;stroke.points.forEach((p,i)=>i?ctx.lineTo(p.x*w,p.y*h):ctx.moveTo(p.x*w,p.y*h));ctx.stroke()}renderMarkers()}
function renderMarkers(){const layer=$("annotationLayer");layer.replaceChildren();for(const a of annotations){const el=document.createElement("div");el.className=`annotation-marker ${a.kind}`;el.textContent=a.id.replace("ANCHOR-","A").replace("REGION-","R");el.role="button";el.tabIndex=0;el.ariaLabel=`编辑${annotationLabel(a)}`;el.onpointerdown=event=>event.stopPropagation();el.onclick=event=>{event.stopPropagation();selectAnnotation(a.id)};el.onkeydown=event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();selectAnnotation(a.id)}};if(a.kind==="anchor"){el.style.left=`${a.position.x*100}%`;el.style.top=`${a.position.y*100}%`}else{el.style.left=`${a.bounds.x*100}%`;el.style.top=`${a.bounds.y*100}%`;el.style.width=`${a.bounds.width*100}%`;el.style.height=`${a.bounds.height*100}%`}layer.append(el)}}
function annotationLabel(a){return a.id.replace("ANCHOR-","锚点 ").replace("REGION-","区域 ")}function selectAnnotation(id){activeAnnotation=id;renderAnnotationUI();setTimeout(()=>$("annotationInstruction").focus(),0)}function renderAnnotationUI(){const group=$("annotationGroup"),tabs=$("annotationTabs"),current=annotations.find(a=>a.id===activeAnnotation);group.classList.toggle("hidden",!annotations.length);$("drawer").classList.toggle("annotation-mode",annotations.length>0);tabs.replaceChildren();for(const a of annotations){const b=document.createElement("button");b.type="button";b.className=`annotation-tab${a.id===activeAnnotation?" active":""}`;b.textContent=annotationLabel(a);b.onclick=()=>selectAnnotation(a.id);tabs.append(b)}$("annotationInstruction").value=current?.instruction||"";$("annotationInstruction").disabled=!current;$("deleteAnnotation").disabled=!current}
function nextId(kind){counters[kind]++;return `${kind==="anchor"?"ANCHOR":"REGION"}-${String(counters[kind]).padStart(2,"0")}`}function addAnnotation(annotation){if(annotations.length>=8){showStatus("最多可添加 8 个标注");return null}annotations.push(annotation);selectAnnotation(annotation.id);draw();return annotation}
function regionBounds(points){const xs=points.map(p=>p.x),ys=points.map(p=>p.y),pad=.015,x=Math.max(0,Math.min(...xs)-pad),y=Math.max(0,Math.min(...ys)-pad),right=Math.min(1,Math.max(...xs)+pad),bottom=Math.min(1,Math.max(...ys)+pad);return{x,y,width:Math.max(.01,right-x),height:Math.max(.01,bottom-y)}}
function updateContextControls(){const local=active.workflow==="local_edit",sketch=local&&active.mode==="sketch_design";document.querySelectorAll(".local-only").forEach(el=>el.classList.toggle("hidden",!local));document.querySelectorAll(".tryon-only").forEach(el=>el.classList.toggle("hidden",active.workflow!=="tryon"||$("category").value!=="earrings"));document.querySelectorAll(".local-tool").forEach(el=>el.classList.toggle("hidden",!local));$("customCategoryField").classList.toggle("hidden",$("category").value!=="other");const locked=sketch&&!!active.stone&&!cutoutConfirmed;document.querySelectorAll('[data-tool="select"],[data-tool="paint"],[data-tool="erase"],[data-tool="anchor"]').forEach(el=>el.disabled=locked)}
function setCutoutConfirmed(value){cutoutConfirmed=value;const required=active.workflow==="local_edit"&&active.mode==="sketch_design"&&!!active.stone;if(required){tool=value?"select":"remove";document.querySelectorAll(".tool").forEach(el=>el.classList.toggle("active",el.dataset.tool===tool))}$("cutoutPanel").classList.toggle("hidden",!required);$("cutoutState").textContent=value?"抠图已确认，可以摆放主石并绘制结构。":"请检查左侧透明与白底预览，必要时修正后确认。";$("cutoutState").classList.toggle("confirmed",value);$("confirmCutout").textContent=value?"抠图已确认":"确认抠图，开始绘制";updateContextControls()}
async function renderApp(){try{$("empty").classList.remove("hidden");tool="select";drag=null;strokes=[];annotations=[];activeAnnotation="";if(matchMedia("(max-width:760px)").matches)$("drawer").classList.add("closed");$("title").textContent=active.title;$("modeBadge").textContent=active.workflow==="tryon"?"模特佩戴":active.mode==="sketch_design"?"随手画转珠宝":active.mode==="put_here"?"定点修改":"局部重绘";$("category").value=active.category;$("customCategory").value=active.customCategory||"";const d=active.defaults||{};for(const id of ["instruction","preserve","change","material","style"])$(id).value=d[id]||"";$("pair").checked=d.pair===true;active.pair=d.pair===true;active.transform={x:d.x??.5,y:d.y??.55,scale:d.scale??(active.workflow==="tryon"?.24:.28),rotation:d.rotation??0};$("scale").value=active.transform.scale;$("rotation").value=active.transform.rotation;syncRanges();const baseSrc=active.workflow==="tryon"?media.model:media.source,overlaySrc=active.workflow==="tryon"?media.jewelry:media.stone;baseImage=baseSrc?await loadImage(baseSrc):null;overlayImage=overlaySrc?await loadImage(overlaySrc):null;cutoutCanvas=overlayImage?autoCutout(overlayImage):null;document.querySelectorAll(".cutout-tool").forEach(el=>el.classList.toggle("hidden",!overlayImage));setCutoutConfirmed(!(active.workflow==="local_edit"&&active.mode==="sketch_design"&&active.stone));renderAssets();updateContextControls();$("empty").classList.add("hidden");$("saveButton").disabled=false;resize();showStatus(overlayImage&&!cutoutConfirmed?"请先确认主石抠图，再开始摆放与绘制":baseSrc?"使用画笔、锚点或主石放置表达设计意图":"空白画板已就绪，直接绘制珠宝结构")}catch(error){terminalLoading("素材载入失败："+error.message)}}
function syncRanges(){$("scaleValue").textContent=`${Math.round(active.transform.scale*100)}%`;$("rotationValue").textContent=`${Math.round(active.transform.rotation)}°`;$("brushValue").textContent=$("brush").value}function point(event){const r=scene.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(event.clientY-r.top)/r.height))}}function inverseOverlay(p){const w=scene.clientWidth,h=scene.clientHeight,t=active.transform,x=p.x*w-t.x*w,y=p.y*h-t.y*h,a=-t.rotation*Math.PI/180,c=Math.cos(a),s=Math.sin(a),rx=x*c-y*s,ry=x*s+y*c,ow=w*t.scale,oh=ow*(cutoutCanvas.height/cutoutCanvas.width);return{x:(rx+ow/2)/ow*cutoutCanvas.width,y:(ry+oh/2)/oh*cutoutCanvas.height}}function brushCutout(p,restore){if(!cutoutCanvas)return;const q=inverseOverlay(p),x=cutoutCanvas.getContext("2d");x.save();x.globalCompositeOperation=restore?"source-over":"destination-out";x.beginPath();x.arc(q.x,q.y,Number($("brush").value)/active.transform.scale,0,Math.PI*2);if(restore&&overlayImage){x.clip();x.drawImage(overlayImage,0,0,cutoutCanvas.width,cutoutCanvas.height)}else{x.fillStyle="#000";x.fill()}x.restore();setCutoutConfirmed(false)}
stage.addEventListener("pointerdown",event=>{if(!active)return;const cutoutLocked=active.workflow==="local_edit"&&active.mode==="sketch_design"&&!!active.stone&&!cutoutConfirmed;if(cutoutLocked&&!['remove','restore','cutout'].includes(tool)){showStatus("请先确认主石抠图");return}const annotationTool=tool==="anchor"||(tool==="paint"&&active.workflow==="local_edit"&&active.mode!=="sketch_design");if(annotationTool&&annotations.length>=8){showStatus("最多可添加 8 个标注");return}const p=point(event);stage.setPointerCapture(event.pointerId);if(tool==="select"&&cutoutCanvas){drag={start:p,x:active.transform.x,y:active.transform.y}}else if(tool==="paint"){const stroke={color:active.mode==="sketch_design"?"#171717":"#d19a38",width:Number($("brush").value)/scene.clientWidth,points:[p]};strokes.push(stroke);drag={stroke}}else if(tool==="erase"){const radius=Number($("brush").value)/scene.clientWidth;strokes=strokes.filter(s=>!s.points.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<radius));draw()}else if(tool==="anchor"){const id=nextId("anchor");addAnnotation({id,kind:"anchor",position:p,instruction:""})}else if(tool==="remove"||tool==="restore"){brushCutout(p,tool==="restore");drag={cutout:tool}}draw()});stage.addEventListener("pointermove",event=>{if(!drag)return;const p=point(event);if(drag.start){active.transform.x=Math.max(0,Math.min(1,drag.x+p.x-drag.start.x));active.transform.y=Math.max(0,Math.min(1,drag.y+p.y-drag.start.y))}else if(drag.stroke)drag.stroke.points.push(p);else if(drag.cutout)brushCutout(p,drag.cutout==="restore");draw()});function finishPointer(){if(drag?.stroke&&active.workflow==="local_edit"&&active.mode!=="sketch_design"){const id=nextId("region");drag.stroke.annotationId=id;addAnnotation({id,kind:"region",bounds:regionBounds(drag.stroke.points),instruction:""})}if(drag?.cutout)renderAssets();drag=null}stage.addEventListener("pointerup",finishPointer);stage.addEventListener("pointercancel",finishPointer);
$("toolDock").addEventListener("click",event=>{const button=event.target.closest("button[data-tool]");if(!button||button.disabled)return;tool=button.dataset.tool;document.querySelectorAll(".tool").forEach(el=>el.classList.toggle("active",el===button));if(tool==="cutout"&&overlayImage){cutoutCanvas=autoCutout(overlayImage);setCutoutConfirmed(false);renderAssets();showStatus("已重新完成边界连通抠图，请检查并确认")}draw()});
$("annotationInstruction").addEventListener("input",event=>{const a=annotations.find(item=>item.id===activeAnnotation);if(a)a.instruction=event.target.value.trimStart()});$("deleteAnnotation").addEventListener("click",()=>{const id=activeAnnotation;annotations=annotations.filter(a=>a.id!==id);strokes=strokes.filter(s=>s.annotationId!==id);activeAnnotation=annotations.at(-1)?.id||"";renderAnnotationUI();draw()});$("confirmCutout").addEventListener("click",()=>{setCutoutConfirmed(true);tool="select";document.querySelectorAll(".tool").forEach(el=>el.classList.toggle("active",el.dataset.tool==="select"));showStatus("抠图已确认，可以开始绘制")});
$("scale").addEventListener("input",event=>{active.transform.scale=Number(event.target.value);syncRanges();draw()});$("rotation").addEventListener("input",event=>{active.transform.rotation=Number(event.target.value);syncRanges();draw()});$("brush").addEventListener("input",syncRanges);$("category").addEventListener("change",event=>{active.category=event.target.value;if(active.category!=="earrings"){active.pair=false;$("pair").checked=false}updateContextControls();draw()});$("pair").addEventListener("change",event=>{active.pair=event.target.checked;draw()});
async function requestFullscreen(){try{if(window.openai?.requestDisplayMode)await window.openai.requestDisplayMode({mode:"fullscreen"});else await rpc("ui/request-display-mode",{mode:"fullscreen"});document.body.classList.add("fullscreen");$("fullscreenButton").textContent="已展开";setTimeout(resize,80)}catch{showStatus("当前宿主未提供全屏编辑，仍可在当前画布操作")}}$("fullscreenButton").addEventListener("click",requestFullscreen);$("drawerButton").addEventListener("click",()=>$("drawer").classList.toggle("closed"));window.addEventListener("resize",resize);async function callTool(name,args){if(window.openai?.callTool)return window.openai.callTool(name,args);return rpc("tools/call",{name,arguments:args})}function resultObject(value){if(value?.structuredContent)return value;return value?.result||value}
async function save(){const button=$("saveButton");button.disabled=true;button.textContent="正在保存";try{if(annotations.some(a=>!a.instruction.trim()))throw new Error("请先填写每个锚点或涂抹区域的修改意见");if(active.workflow==="local_edit"&&active.mode==="sketch_design"&&active.stone&&!cutoutConfirmed)throw new Error("请先确认主石抠图");const category=$("category").value,customCategory=$("customCategory").value.trim();if(category==="other"&&!customCategory)throw new Error("请输入自定义作品品类");draw();const state=active.workflow==="local_edit"?{schemaVersion:2,mode:active.mode,category,...(category==="other"?{customCategory}:{}),...(active.source?{sourcePath:active.source.path}:{}),...(active.stone?{stonePath:active.stone.path}:{}),referenceImages:active.referenceImages.map(({path,role})=>({path,role})),instruction:$("instruction").value.trim(),preserve:$("preserve").value.trim(),change:$("change").value.trim(),material:$("material").value.trim(),style:$("style").value.trim(),ratio:active.defaults.ratio||"1:1",annotations,cutoutConfirmed}: {category,jewelryPath:active.jewelry.path,modelPath:active.model.path,instruction:$("instruction").value.trim(),pair:$("pair").checked,ratio:active.defaults.ratio||"3:4",transform:{...active.transform}};const cutoutDataUrl=cutoutCanvas?cutoutCanvas.toDataURL("image/png"):"",cutoutPreviewDataUrl=cutoutCanvas?whitePreviewDataUrl():"";const raw=await callTool("save_jewelry_visual_draft",{workspacePath:active.workspacePath,workflow:active.workflow,state,compositeDataUrl:scene.toDataURL("image/jpeg",.88),...(cutoutDataUrl?{cutoutDataUrl,cutoutPreviewDataUrl}:{})});const result=resultObject(raw);if(result?.isError)throw new Error(result.content?.[0]?.text||"保存失败");const draft=result?.structuredContent?.visualDraft;if(!draft)throw new Error("宿主未返回草稿编号");const text=`已保存珠宝视觉草稿 ${draft.id}。\nCurrent visual draft (JSON): ${JSON.stringify({visualDraftId:draft.id,workflow:draft.workflow,draftPath:draft.draftPath})}`;if(window.openai?.sendFollowUpMessage)await window.openai.sendFollowUpMessage({prompt:text});else await rpc("ui/message",{role:"user",content:[{type:"text",text}]});button.textContent="已保存";showStatus(`草稿 ${draft.id} 已回写对话，等待生成`,0)}catch(error){button.disabled=false;button.textContent="保存并继续";showStatus(error.message,0)}}$("saveButton").addEventListener("click",save);
const compatibility=()=>{const output=window.openai?.toolOutput,input=window.openai?.toolInput,error=toolError(output);if(error){active=null;terminalLoading(error);return}if(output)payload({structuredContent:output},window.openai?.toolResponseMetadata||{});else if(input)payload({structuredContent:input},{},true)};connect().finally(()=>{compatibility();setTimeout(()=>{if(!active)compatibility();if(!active&&$("empty").querySelector("img"))terminalLoading("等待视觉工作台数据超时，请重新调用工具")},9000)});
