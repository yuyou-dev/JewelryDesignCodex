<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>珠宝设计成品</title>
    <style>
      :root { color-scheme:light dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --fg:#191919; --muted:#707070; --line:rgba(127,127,127,.24); --surface:rgba(127,127,127,.07); --accent:#a77d2d; }
      * { box-sizing:border-box; }
      html,body { margin:0; overflow-x:hidden; overflow-y:hidden; overscroll-behavior:none; background:transparent; color:var(--fg); }
      body { padding:6px 8px 8px; }
      main { width:100%; min-width:0; }
      header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; }
      h1 { margin:0; font-size:17px; line-height:1.3; }
      .caption { margin:3px 0 0; max-width:64ch; overflow:hidden; color:var(--muted); font-size:13px; line-height:1.4; text-overflow:ellipsis; white-space:nowrap; }
      .counter { padding-top:3px; color:var(--muted); font-size:12px; white-space:nowrap; }
      .gallery-grid { position:relative; display:grid; grid-template-columns:70px minmax(0,650px) minmax(180px,200px); gap:12px; width:100%; max-width:944px; height:clamp(400px,50vw,560px); min-height:0; }
      .gallery-grid.dense { grid-template-columns:124px minmax(0,650px) minmax(180px,200px); max-width:998px; }
      .gallery-grid.single { grid-template-columns:minmax(0,650px) minmax(180px,200px); max-width:862px; }
      .design-rail { display:grid; grid-auto-rows:68px; align-content:start; gap:8px; min-height:0; }
      .design-rail.dense { grid-template-columns:repeat(2,58px); grid-auto-rows:58px; }
      .design-button { position:relative; width:68px; height:68px; min-width:44px; min-height:44px; aspect-ratio:1; padding:0; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer; }
      .design-button img { width:100%; height:100%; display:block; object-fit:cover; }
      .design-rail.dense .design-button { width:58px; height:58px; }
      .design-button span { position:absolute; left:4px; bottom:4px; padding:2px 5px; border-radius:4px; background:rgba(15,15,15,.72); color:#fff; font-size:10px; line-height:1; }
      .design-button[aria-current="true"] { border-color:#171717; box-shadow:0 0 0 2px rgba(23,23,23,.22); }
      .design-button:focus-visible,.select:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent); outline-offset:2px; }
      .stage { position:relative; min-width:0; min-height:0; overflow:hidden; border-radius:12px; background:var(--surface); touch-action:pan-y; }
      .stage img { width:100%; height:100%; display:block; object-fit:contain; }
      .piece-tag { position:absolute; top:10px; left:10px; padding:5px 8px; border-radius:7px; background:rgba(15,15,15,.7); color:#fff; font-size:12px; backdrop-filter:blur(8px); }
      .details { min-width:0; display:flex; flex-direction:column; padding:8px 2px 4px; }
      .design-id { margin:0 0 7px; color:var(--accent); font-size:12px; font-weight:720; letter-spacing:.05em; overflow-wrap:anywhere; }
      .details h2 { margin:0 0 7px; font-size:17px; line-height:1.3; }
      .details p { margin:0; color:var(--muted); font-size:13px; line-height:1.5; }
      .summary { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
      .facts { margin-top:10px; display:grid; gap:4px; }
      .facts p { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; overflow:hidden; }
      .actions { margin-top:auto; }
      .select { width:100%; min-height:44px; padding:10px 14px; border:0; border-radius:999px; background:#171717; color:#fff; font:inherit; font-size:13px; font-weight:720; cursor:pointer; }
      .select:disabled { opacity:.55; cursor:default; }
      .status { min-height:16px; margin:6px 0 0; color:var(--muted); font-size:11px; line-height:1.35; text-align:center; }
      .loading,.error { min-height:340px; display:grid; place-items:center; color:var(--muted); font-size:13px; text-align:center; }
      .loading picture,.loading img { display:block; width:64px; height:64px; margin:auto; }
      .loading p,.error p { margin:6px 0 0; }
      [hidden] { display:none!important; }
      @media (max-width:620px) { body{padding-inline:4px}.gallery-grid{grid-template-columns:62px minmax(0,1fr);height:clamp(440px,108vw,500px);gap:8px}.gallery-grid.dense{grid-template-columns:112px minmax(0,1fr)}.gallery-grid.single{grid-template-columns:minmax(0,1fr)}.design-rail{grid-auto-rows:60px;gap:7px}.design-rail.dense{grid-template-columns:repeat(2,52px);grid-auto-rows:52px}.design-button{width:60px;height:60px}.design-rail.dense .design-button{width:52px;height:52px}.details{position:absolute;right:8px;bottom:8px;width:min(220px,calc(100% - 80px));max-height:150px;padding:10px;border-radius:10px;background:color-mix(in srgb,Canvas 90%,transparent);box-shadow:0 4px 18px rgba(0,0,0,.12);backdrop-filter:blur(12px)}.gallery-grid.dense .details{width:min(220px,calc(100% - 130px))}.gallery-grid.single .details{width:min(220px,calc(100% - 16px))}.details h2{font-size:14px;margin-bottom:4px}.details p{font-size:12px}.summary{-webkit-line-clamp:1}.facts{display:none}.select{min-height:40px;margin-top:6px;padding-block:8px;font-size:12px} }
      @media (prefers-color-scheme:dark) { :root{--fg:#f3f3f3;--muted:#aaa;--accent:#d2ad64}.design-button[aria-current="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.24)} }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important;transition:none!important} }
    </style>
  </head>
  <body>
    <main data-brand="{{BRAND_NAME}}">
      <section id="loading" class="loading"><div><picture><source media="(prefers-reduced-motion: reduce)" srcset="{{BRAND_STATIC_DATA_URI}}" /><img src="{{BRAND_LOADING_DATA_URI}}" alt="" /></picture><p>{{BRAND_NAME}} · 正在加载设计成品…</p></div></section>
      <section id="error" class="error" role="status" hidden><div><strong>无法显示设计 Gallery</strong><p id="error-text"></p></div></section>
      <section id="content" hidden>
        <header><div><h1 id="title"></h1><p id="caption" class="caption"></p></div><span id="counter" class="counter"></span></header>
            <div class="gallery-grid"><nav id="design-rail" class="design-rail" aria-label="珠宝设计成品"></nav><div class="stage" tabindex="0"><img id="design-image" alt="珠宝设计成品" /><span id="piece-tag" class="piece-tag"></span></div><aside class="details"><p id="design-id" class="design-id"></p><h2 id="design-title"></h2><p id="summary" class="summary"></p><div id="facts" class="facts"></div><div class="actions"><button id="select" class="select" type="button">选定此图继续</button><p id="status" class="status" aria-live="polite"></p></div></aside></div>
      </section>
    </main>
    <script>
      (()=>{
        const APP_PROTOCOL="2026-01-26";let requestId=0,connected=false,hostCanMessage=false,hostCanUpdateContext=false,active=null,currentId="";const pending=new Map();
        setTimeout(()=>{if(!document.querySelector("#loading").hidden)showError("等待设计成品超时，请在对话中重试 Gallery。")},15000);
        const notify=(method,params={})=>window.parent.postMessage({jsonrpc:"2.0",method,params},"*");const request=(method,params={},timeout=6000)=>new Promise((resolve,reject)=>{const id=++requestId,timer=setTimeout(()=>{pending.delete(id);reject(new Error("host timeout"));},timeout);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");});
        window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id&&pending.has(message.id)){const item=pending.get(message.id);pending.delete(message.id);clearTimeout(item.timer);message.error?item.reject(new Error(message.error.message)):item.resolve(message.result)}if(message.method==="ui/notifications/tool-input")accept(message.params?.arguments??message.params);if(message.method==="ui/notifications/tool-result")accept(message.params,true)});
        function parse(value,depth=0){if(depth>2||value==null)return value;if(typeof value==="string"){try{return parse(JSON.parse(value),depth+1)}catch{return value}}if(typeof value!=="object")return value;if(value.isError){const text=value.content?.find(item=>item?.type==="text")?.text;return{error:text||"工具未能准备设计成品。"}}if(value.structuredContent?.designGallery)return{gallery:value.structuredContent.designGallery,media:value._meta?.designMedia};if(value.designGallery)return{gallery:value.designGallery,media:value.media??value.designMedia??value._meta?.designMedia};if(value.result)return parse(value.result,depth+1);const text=value.content?.length===1&&value.content[0]?.type==="text"?value.content[0].text:null;if(text){const candidate=parse(text,depth+1);if(candidate!==text)return candidate}return value}
        function showError(message){document.querySelector("#loading").hidden=true;document.querySelector("#content").hidden=true;document.querySelector("#error").hidden=false;document.querySelector("#error-text").textContent=message||"未收到可展示的媒体结果。";sendSize()}
        function accept(value,isResult=false){const payload=parse(value);if(payload?.error){showError(payload.error);return}const gallery=payload?.gallery,media=payload?.media;if(!gallery||!Array.isArray(gallery.items)||gallery.items.length===0||gallery.items.length>12||!media?.items){if(isResult)showError("未收到完整的设计与预览数据。");return}const items=gallery.items.map(item=>({...item,preview:media.items[item.id]})).filter(item=>item.preview);if(items.length!==gallery.items.length){showError("部分设计缺少预览，已停止展示以避免漏图。");return}active={...gallery,items};currentId=items.some(item=>item.id===gallery.initialDesignId)?gallery.initialDesignId:items[0].id;render()}
        function render(){document.querySelector("#loading").hidden=true;document.querySelector("#error").hidden=true;document.querySelector("#content").hidden=false;document.querySelector("#title").textContent=active.title||"珠宝设计成品";const caption=document.querySelector("#caption");caption.textContent=active.caption||"";caption.hidden=!caption.textContent;const rail=document.querySelector("#design-rail"),grid=document.querySelector(".gallery-grid"),single=active.items.length===1,dense=active.items.length>5;grid.classList.toggle("single",single);grid.classList.toggle("dense",dense);rail.classList.toggle("dense",dense);rail.replaceChildren(...active.items.map((item,index)=>{const button=document.createElement("button"),image=document.createElement("img"),badge=document.createElement("span");button.type="button";button.className="design-button";button.dataset.id=item.id;button.setAttribute("aria-label",item.title||item.id);button.setAttribute("aria-current",String(item.id===currentId));image.addEventListener("error",()=>showError("设计预览解码失败，请在对话中查看行内图片。"),{once:true});image.src=item.preview;image.alt="";badge.textContent=String(index+1).padStart(2,"0");button.append(image,badge);button.addEventListener("click",()=>{currentId=item.id;show()});return button}));rail.hidden=single;show();sendSize()}
        function show(){const index=active.items.findIndex(item=>item.id===currentId),item=active.items[index];document.querySelectorAll(".design-button").forEach(button=>button.setAttribute("aria-current",String(button.dataset.id===currentId)));document.querySelector("#counter").textContent=`${index+1} / ${active.items.length}`;const image=document.querySelector("#design-image");image.onerror=()=>showError("设计预览解码失败，请在对话中查看行内图片。");image.src=item.preview;image.alt=item.title||"珠宝设计成品";const tag=document.querySelector("#piece-tag");tag.textContent=item.pieceType||"珠宝设计";document.querySelector("#design-id").textContent=item.id;document.querySelector("#design-title").textContent=item.title||item.id;document.querySelector("#summary").textContent=item.summary||"已完成的珠宝设计。";const facts=[["材质",item.materials],["宝石",item.gemstones],["工艺",item.craft],["场景",item.useCase]].filter(([,value])=>value);document.querySelector("#facts").replaceChildren(...facts.map(([label,value])=>{const p=document.createElement("p");p.textContent=`${label} · ${value}`;return p}));document.querySelector("#status").textContent="";sendSize()}
        async function sendMessage(text){if(connected&&hostCanMessage){try{await request("ui/message",{role:"user",content:[{type:"text",text}]},8000);return}catch{}}if(window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt:text,scrollToBottom:false});return}throw new Error("当前宿主不支持选择回写")}
        function selectionText(context){return `已选中珠宝视觉资产 ${context.assetId}。等待用户下一条任务指令；不要预设精修、二创、海报、画册、展示、视频或其他工作流。\n\nCurrent jewelry asset selection (JSON):\n${JSON.stringify(context)}`}
        async function recordSelection(context){const text=selectionText(context);if(connected&&hostCanUpdateContext){try{await request("ui/update-model-context",{content:[{type:"text",text}],structuredContent:{jewelryAssetSelection:context}},8000);return"context"}catch{}}await sendMessage(text);return"message"}
        document.querySelector("#select").addEventListener("click",async event=>{const button=event.currentTarget,status=document.querySelector("#status"),context={assetId:currentId,sourceWorkflow:active?.sourceWorkflow||"design"};button.disabled=true;button.textContent="正在记录…";try{const mode=await recordSelection(context);button.textContent="已选中";status.textContent=mode==="context"?"已选中，请在输入框说明下一步。":"已回写对话，请继续说明下一步。"}catch(error){button.disabled=false;button.textContent="选定此图继续";status.textContent=error.message}sendSize()});
        window.addEventListener("keydown",event=>{if(!active||active.items.length<2||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)||!event.target.closest?.(".design-rail,.stage"))return;event.preventDefault();const keepRailFocus=Boolean(event.target.closest(".design-rail")),index=active.items.findIndex(item=>item.id===currentId),next=(index+(['ArrowUp','ArrowLeft'].includes(event.key)?-1:1)+active.items.length)%active.items.length;currentId=active.items[next].id;show();if(keepRailFocus){const nextButton=document.querySelector(`.design-button[data-id="${CSS.escape(currentId)}"]`);nextButton.focus()}});
        function sendSize(){notify("ui/notifications/size-changed",{width:Math.ceil(window.innerWidth),height:Math.ceil(document.querySelector("main").getBoundingClientRect().height)})}new ResizeObserver(sendSize).observe(document.querySelector("main"));
        async function connect(){try{const result=await request("ui/initialize",{protocolVersion:APP_PROTOCOL,appInfo:{name:"suwa-jewelry-design-gallery",version:"1.1.0"},appCapabilities:{availableDisplayModes:["inline"]}});connected=true;hostCanMessage=Boolean(result?.hostCapabilities?.message?.text);hostCanUpdateContext=Boolean(result?.hostCapabilities?.updateModelContext);notify("ui/notifications/initialized")}catch{accept(window.openai?.toolInput);accept(window.openai?.toolOutput,true)}}accept(window.openai?.toolInput);accept(window.openai?.toolOutput,true);connect();
      })();
    </script>
  </body>
</html>
